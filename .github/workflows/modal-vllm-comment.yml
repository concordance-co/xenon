name: Modal vLLM Comment Trigger

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  authorize:
    name: Authorize command
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.auth.outputs.run }}
      ref: ${{ steps.auth.outputs.ref }}
      suite: ${{ steps.auth.outputs.suite }}

    steps:
      - name: Parse and authorize Modal command
        id: auth
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim();
            const commands = new Map([
              ["/modal-smoke", "smoke"],
              ["/modal-contracts", "contracts"],
              ["/modal-full", "full"],
            ]);

            const suite = commands.get(body.split(/\s+/)[0]);
            if (!suite) {
              core.setOutput("run", "false");
              return;
            }

            const trusted = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const association = context.payload.comment.author_association;
            if (!trusted.has(association)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Ignoring ${body}: Modal runs require OWNER, MEMBER, or COLLABORATOR permissions.`,
              });
              core.setOutput("run", "false");
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const sameRepo = pull.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!sameRepo) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Ignoring ${body}: Modal secrets are only available for branches in this repository, not forked PRs.`,
              });
              core.setOutput("run", "false");
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Starting Modal vLLM ${suite} for ${pull.head.sha}.`,
            });

            core.setOutput("run", "true");
            core.setOutput("ref", pull.head.sha);
            core.setOutput("suite", suite);

  run:
    needs: authorize
    if: needs.authorize.outputs.run == 'true'
    uses: ./.github/workflows/modal-vllm-reusable.yml
    with:
      ref: ${{ needs.authorize.outputs.ref }}
      suite: ${{ needs.authorize.outputs.suite }}
      shard_count: "2"
      max_containers: "2"
    secrets: inherit
