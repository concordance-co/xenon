name: Local Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: local-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra interp --extra analysis --extra dev --extra modal

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run pytest -q tests --ignore=tests/test_pipelines_v2_dashboard.py
